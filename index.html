<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Lift — 4 Day Plan</title>
<style>
:root{
 --bg:#090b0f;--surface:#11151b;--surface2:#181d25;--surface3:#202631;
 --text:#f6f7f9;--muted:#929daa;--line:#2a313c;--blue:#75d5ff;--purple:#a78bfa;
 --green:#71e1a0;--orange:#ffbf69;--red:#ff7189;--radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}
body{min-height:100vh;overscroll-behavior-y:none}
button,input{font:inherit}
button{border:0;color:inherit}
.app{max-width:760px;margin:auto;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.header{padding:calc(18px + env(safe-area-inset-top)) 18px 14px}
.kicker{font-size:11px;font-weight:900;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}
h1{font-size:34px;line-height:1;margin:8px 0 7px;letter-spacing:-.04em}
.sub{color:var(--muted);font-size:14px;line-height:1.45}
.topstats{display:flex;gap:8px;margin-top:14px;overflow:auto;scrollbar-width:none}
.topstats::-webkit-scrollbar{display:none}
.stat{white-space:nowrap;padding:8px 11px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;color:#dce2ea}
.nav{
 position:sticky;top:0;z-index:30;padding:8px 12px;
 background:rgba(9,11,15,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 border-bottom:1px solid rgba(255,255,255,.06)
}
.navrow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.navbtn{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:10px 3px 8px;font-size:10px;font-weight:900;color:var(--muted)}
.navbtn.active{background:linear-gradient(145deg,#172936,#211e31);color:var(--text);border-color:#485766}
.navbtn span{display:block;font-size:18px;margin-bottom:3px}
.screen{display:none;padding:0 13px}.screen.active{display:block}
.dayhead{padding:18px 5px 10px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.dayhead h2{font-size:27px;margin:0;letter-spacing:-.035em}.dayhead p{margin:5px 0 0;color:var(--muted);font-size:13px}
.start{background:var(--text);color:#080a0d;padding:10px 13px;border-radius:13px;font-weight:900;font-size:12px;white-space:nowrap}
.progress{height:5px;background:#20252d;border-radius:99px;overflow:hidden;margin:3px 5px 12px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:.25s}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 14px;touch-action:pan-x}
.carousel::-webkit-scrollbar{display:none}
.card{flex:0 0 calc(100vw - 28px);max-width:730px;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-height:520px;box-shadow:0 18px 45px rgba(0,0,0,.22)}
.cardtop{display:flex;justify-content:space-between;gap:12px}
.eyenum{font-size:10px;letter-spacing:.12em;font-weight:900;color:var(--blue)}
.card h3{font-size:23px;line-height:1.1;margin:6px 0 5px;letter-spacing:-.025em}
.focus{color:var(--muted);font-size:13px}
.badge{font-size:11px;font-weight:900;padding:7px 9px;background:var(--surface3);border:1px solid var(--line);border-radius:999px;white-space:nowrap;height:max-content}
.sectiontitle{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-weight:900;margin:18px 0 7px}
p,li{font-size:14px;line-height:1.5;color:#dce2e9}
ul{padding-left:19px;margin:6px 0}
.cue{margin-top:12px;padding:12px 13px;background:#0d151b;border:1px solid #263b47;border-radius:13px;color:#eaf8ff;font-weight:800;font-size:13px}
.avoid{margin-top:10px;padding:12px 13px;background:#191115;border:1px solid #3a2029;border-radius:13px;color:#f3d9df;font-size:13px}
.setlog{margin-top:14px;padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:15px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:7px;align-items:center;margin-top:7px}
.setrow span{font-size:11px;color:var(--muted);font-weight:800}
.setrow input{width:100%;min-width:0;background:#0d1015;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px;font-size:13px;outline:none}
.setrow input:focus{border-color:#5c7283}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 8px}
.ctrl{background:var(--surface2);border:1px solid var(--line);padding:11px 14px;border-radius:13px;font-size:12px;font-weight:900}
.ctrl:disabled{opacity:.3}.counter{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:3px 4px 16px}
.action{background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:14px;font-weight:800;font-size:12px}
.action.primary{background:linear-gradient(135deg,#18303b,#29203c);border-color:#435363}
details{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:10px 4px;overflow:hidden}
summary{padding:15px;font-weight:900;font-size:13px;cursor:pointer}
.inside{padding:0 15px 15px}
.check{display:flex;gap:9px;padding:7px 0;color:#dbe2e9;font-size:13px;line-height:1.45}
.check input{accent-color:var(--blue);margin-top:3px}
.home{padding:18px 5px}.homecard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:11px}
.homecard h3{margin:0 0 7px;font-size:17px}.homecard p{margin:0;color:var(--muted)}
.timer{position:fixed;left:14px;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:60;background:rgba(19,24,31,.96);backdrop-filter:blur(18px);border:1px solid #39424e;border-radius:20px;padding:13px;display:none;box-shadow:0 20px 55px rgba(0,0,0,.5)}
.timer.show{display:block}.timerrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.timerbig{font-variant-numeric:tabular-nums;font-size:28px;font-weight:900}.timer button{background:var(--surface3);padding:9px 11px;border-radius:11px;font-size:11px;font-weight:900}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(9,11,15,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.07)}
.bottomrow{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bottom button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 5px;color:var(--muted);font-size:10px;font-weight:900}
.bottom button.active{color:var(--text);border-color:#4b5968}
.footer{padding:22px 6px;color:#707b88;font-size:11px;line-height:1.5}
@media(min-width:700px){.card{flex-basis:680px}.screen{padding:0 18px}.nav{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
 <div class="kicker">LIFT · 4 DAY PROGRAM</div>
 <h1>Train. Log. Progress.</h1>
 <div class="sub">Swipe through each exercise. Log your sets, use the rest timer, and keep the same plan for 6–8 weeks before changing it.</div>
 <div class="topstats">
  <div class="stat">2–3 RIR default</div><div class="stat">Full controlled ROM</div><div class="stat">Progressive overload</div><div class="stat">60–90 min</div>
 </div>
</header>

<nav class="nav"><div class="navrow">
 <button class="navbtn active" data-day="push"><span>🔥</span>PUSH</button>
 <button class="navbtn" data-day="pull"><span>🧲</span>PULL</button>
 <button class="navbtn" data-day="legs"><span>🦵</span>LEGS</button>
 <button class="navbtn" data-day="arms"><span>💪</span>ARMS + CORE</button>
</div></nav>

<main>
<section id="push" class="screen active"></section>
<section id="pull" class="screen"></section>
<section id="legs" class="screen"></section>
<section id="arms" class="screen"></section>
<section id="home" class="screen"></section>
</main>

<div class="timer" id="timer">
 <div class="timerrow">
  <div><div style="font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.1em">REST TIMER</div><div class="timerbig" id="timerText">01:30</div></div>
  <button id="timerMinus">−15s</button><button id="timerPlus">+15s</button><button id="timerStart">Start</button><button id="timerClose">✕</button>
 </div>
</div>

<nav class="bottom"><div class="bottomrow">
 <button class="active" data-bottom="push">🏋️<br>Workout</button>
 <button data-bottom="home">📖<br>Guide</button>
 <button data-bottom="reset">↻<br>Reset logs</button>
</div></nav>
</div>

<script>
const data={
push:{title:"Push",sub:"Chest · Shoulders · Triceps",time:"65–80 min",warm:["5 min easy walk/bike/elliptical","Arm circles: 10 forward + 10 backward","External rotations: 10–15","Scapular push-ups: 8–12","Band pull-aparts: 12–15","Thoracic rotations: 6–8/side","Progressive warm-up sets for your first press"],stretch:["Doorway chest: 30–45 sec × 2","Overhead triceps: 30 sec/side × 2","Cross-body shoulder: 20–30 sec/side","Lat stretch: 30–45 sec"],ex:[
["Incline Dumbbell Press","3 × 6–10","2–3 min","Upper chest / anterior delts","Primary upper-chest press. Use a moderate 20–30° incline.","Set feet firmly. Pull shoulder blades gently back/down. Lower under control to a comfortable deep stretch. Keep elbows about 30–60° from the torso. Press strongly without crashing the dumbbells together.","Bring my upper arms together.","Bench too steep; elbows flared; bouncing; cutting ROM."],
["Machine Chest Press","3 × 8–12","~2 min","Chest","Stable pressing lets you accumulate quality chest volume.","Set the seat so handles sit around mid/lower chest. Keep chest against the pad. Lower into a controlled stretch, then press without shrugging or aggressively rolling the shoulders forward.","Drive the elbows toward each other.","Shrugging; tiny ROM; bouncing."],
["Cable Fly","2–3 × 10–15","60–90 sec","Chest","Adds a large controlled ROM and complements pressing.","Keep a slight elbow bend. Open until you feel a controlled stretch. Bring hands together in an arc and briefly squeeze. Return slowly.","The movement comes from the shoulder joint, not body swing.","Swinging; painful stretch; progressively bending the elbows."],
["Cable Lateral Raise","3 × 12–20","60–90 sec","Lateral delts","High-value shoulder-width isolation.","Stand slightly sideways to the cable. Slight elbow bend. Raise outward leading with the elbow. Stop around shoulder height or slightly above if comfortable. Lower slowly.","Light weight + strict reps.","Swinging; shrugging; turning it into an upright row."],
["Machine / Dumbbell Shoulder Press","2 × 8–12","~2 min","Shoulders","Adds direct overhead pressing without excessive front-delt volume.","Use a supported seat. Keep wrists stacked over elbows. Lower through a comfortable ROM and press vertically without aggressively shrugging.","Keep the ribcage controlled.","Excessive arch; painful ROM; momentum."],
["Overhead Cable Triceps Extension","3 × 10–15","60–90 sec","Triceps — long head","Lengthened-position triceps work.","Cable behind you. Keep upper arms relatively fixed. Bend elbows deeply under control, then extend without turning it into a shoulder movement.","Move the forearms; keep upper arms mostly still.","Elbows flaring wildly; shoulder movement; momentum."],
["Rope Triceps Pressdown","2 × 10–15","60–90 sec","Triceps","Stable finishing volume.","Keep elbows near sides and shoulders down. Press rope toward thighs, separate slightly at the bottom, and return slowly.","Make the elbow joint do the work.","Leaning your body into the stack; elbow drift; bouncing."]
]},
pull:{title:"Pull",sub:"Back · Biceps · Rear delts",time:"65–80 min",warm:["5 min easy cardio","Dead hang: 20–30 sec if comfortable","Scapular pulldowns: 10","Band pull-aparts: 12–15","Light face pulls: 12–15","Progressive warm-up for first pull"],stretch:["Lat stretch: 30–45 sec/side","Biceps wall stretch: 20–30 sec/side","Rear-delt cross-body: 20–30 sec/side","Thoracic rotation: 6–8/side"],ex:[
["Pull-up / Neutral-Grip Lat Pulldown","3 × 6–10","2–3 min","Lats / upper back","Primary vertical pull. Use pull-ups if clean; otherwise use a neutral-grip pulldown.","Brace torso. Start with arms extended. Pull elbows down toward your sides. Bring handles/bar toward upper chest, pause, then let arms extend under control.","Elbows into my pockets.","Behind-neck pulls; swinging; turning it into a row; short ROM."],
["Chest-Supported Row","3 × 8–12","~2 min","Mid-back / lats","Reduces lower-back stabilization demands so you can focus on the back.","Chest firmly against pad. Let arms extend. Pull elbows backward without shrugging. Bring handles toward lower ribs and lower fully.","Drive elbows behind you, not hands toward you.","Shrugging; half reps; torso momentum."],
["Single-Arm Cable Row","2 × 10–15 / side","60–90 sec","Lats / mid-back","Unilateral work with a large ROM.","Reach into a comfortable stretch, allow natural shoulder-blade movement, then pull elbow back/down and control the return.","Reach long, then pull elbow toward hip.","Torso rotation; jerking; cutting the stretch."],
["Reverse Pec Deck","3 × 12–20","60–90 sec","Rear delts","Stable rear-delt isolation.","Chest against pad. Slight elbow bend. Move arms outward while keeping shoulders away from ears. Return slowly.","Move the elbows apart.","Shrugging; swinging; excessive weight."],
["Incline Dumbbell Curl","3 × 8–12","~90 sec","Biceps","Direct biceps work in a lengthened position.","Sit back with arms hanging naturally. Keep shoulders controlled. Curl without driving elbows forward. Lower through a comfortable full ROM.","Keep the upper arm quiet.","Turning it into a front raise; swinging; cutting bottom ROM."],
["Preacher Curl","2 × 10–15","~90 sec","Biceps","Limits body English and keeps the biceps working.","Secure armpits against the pad. Lower under control. Don't violently lock the elbow. Curl without lifting shoulders.","Own the bottom half.","Bouncing; lifting shoulders; momentum."]
]},
legs:{title:"Legs",sub:"Quads · Hamstrings · Calves · Adductors",time:"70–90 min",warm:["5 min cycling or incline walking","Bodyweight squats: 10","Reverse lunges: 6/side","Leg swings: 10/side","Glute bridges: 10","Ankle rocks: 10/side","90/90 hip transitions: 5/side","Progressive hack-squat warm-up sets"],stretch:["Standing quad: 30–45 sec/side","Half-kneeling hip flexor: 30–45 sec/side","Seated hamstring: 30–45 sec/side","Straight-knee calf: 30–45 sec/side","Bent-knee soleus: 30–45 sec/side","Adductor rock-backs: 8–10/side"],ex:[
["Hack Squat","3 × 6–10","2–3 min","Quads / glutes","Primary squat pattern with strong lower-body loading.","Feet about shoulder width, toes slightly outward. Brace. Descend as deep as you can control. Let knees track with toes. Drive through whole foot.","Knees forward and out; stay connected to the pad.","Forcing depth; knees collapsing; bouncing."],
["Leg Press","3 × 10–15","~2 min","Quads / glutes","Stable compound volume after hack squats.","Use a stance that lets knees track with toes. Lower under control. Keep pelvis stable at the bottom. Press through the whole foot.","Use the deepest ROM you can control while keeping the pelvis stable.","Pelvic rollover; tiny partials; knee collapse."],
["Leg Extension","2 × 12–15","60–90 sec","Quads","Direct quad isolation; a good place to push closer to failure occasionally.","Align knee roughly with machine pivot. Back against pad. Extend smoothly, squeeze briefly, lower under control.","Make knee extension do all the work.","Kicking; bouncing; excessive weight."],
["Romanian Deadlift","3 × 6–10","2–3 min","Hamstrings / glutes","Primary hip hinge for posterior-chain strength and hamstring length.","Soft knees. Brace. Push hips backward while keeping the load close. Descend until hamstrings are strongly stretched without losing control. Drive hips forward.","Push the hips backward; don't think of it as bending forward.","Squatting the RDL; load drifting away; chasing depth; max-effort deadlifting."],
["Seated Leg Curl","3 × 10–15","~90 sec","Hamstrings","Direct knee-flexion work to complement the RDL.","Keep hips against pad. Curl heels down/back. Squeeze briefly. Return slowly without lifting hips.","Pull the pad with your hamstrings.","Hip lifting; bouncing; cutting the return."],
["Standing Calf Raise","3 × 8–15","60–90 sec","Calves","Heavy calf work through controlled ROM.","Lower heel into a comfortable stretch, rise high, squeeze, and lower slowly.","Stretch → full contraction → controlled repeat.","Bouncing; tiny ROM; momentum."],
["Seated Calf Raise","2 × 12–20","60–90 sec","Calves","Bent-knee calf work to complement standing raises.","Secure knees. Lower under control, drive through forefoot, and reach a full comfortable contraction.","Every rep is a calf raise, not an ankle bounce.","Bouncing; half reps."],
["Adductor Machine","2 × 12–20","60–90 sec","Adductors","Direct adductor volume.","Start with a comfortable opening. Control the return and squeeze inward without slamming pads together.","Controlled opening and contraction.","Forcing stretch; momentum; painful end range."]
]},
arms:{title:"Arms + Core",sub:"Biceps · Triceps · Abs",time:"55–70 min",warm:["3–5 min easy cardio","Band curls: 15","Band pressdowns: 15","Shoulder circles: 10","Dead bug: 6/side","Light warm-up set for first curl and pressdown"],stretch:["Biceps stretch: 20–30 sec/side","Overhead triceps: 30 sec/side","Child's pose / lat stretch: 30–45 sec","Hip flexor: 30 sec/side"],ex:[
["EZ-Bar Curl","3 × 6–10","90–120 sec","Biceps","Primary heavier biceps movement for arm specialization.","Brace core and keep elbows near torso. Curl without swinging. Lower through controlled ROM.","If you have to lean backward, the weight is too heavy.","Hip drive; excessive lean; half reps."],
["Bayesian Cable Curl","2 × 10–15","60–90 sec","Biceps","Cable curl with upper arm behind torso for lengthened-position work.","Stand slightly forward of cable. Keep upper arm behind torso. Curl while keeping shoulder position stable. Lower slowly.","Keep upper arm behind you and let elbow flex.","Shoulder rolling forward; swinging; cutting stretch."],
["Hammer Curl","2 × 10–15","60–90 sec","Brachialis / forearm / biceps","Neutral-grip arm thickness work.","Neutral grip, elbows near body, curl without swing, lower under control.","Move the forearm; keep upper arm quiet.","Shrugging; body swing."],
["Cable Triceps Pressdown","3 × 8–12","60–90 sec","Triceps","Stable triceps loading.","Keep elbows near sides. Extend toward floor and control the return.","Pin the upper arm and move the elbow joint.","Leaning into stack; flaring; bouncing."],
["Overhead Cable Triceps Extension","2 × 10–15","60–90 sec","Triceps — long head","Lengthened-position triceps work.","Cable behind you. Keep upper arms relatively fixed. Allow a deep comfortable elbow bend, then extend smoothly.","Deep stretch, then elbow extension.","Shoulder movement; painful ROM."],
["Cross-Body Cable Triceps Extension","2 × 12–15","60–90 sec","Triceps","Stable finishing isolation from another angle.","Set cable around upper-chest height. Bring arm across body and extend elbow while keeping shoulder stable.","Keep shoulder quiet; extend the elbow.","Torso rotation; momentum."],
["Cable Crunch","3 × 10–15","60–90 sec","Abdominals","Loaded trunk flexion that is easy to progress.","Kneel with cable above/forward. Keep hips relatively stable. Curl ribs toward pelvis and return under control.","Ribs toward pelvis.","Turning it into a hip hinge; pulling only with arms."],
["Pallof Press","2 × 10–15 / side","60–90 sec","Anti-rotation core","Trains the trunk to resist rotation.","Stand perpendicular to cable. Brace. Press hands straight out while resisting rotation, then return.","Make your torso boring: no rotation.","Twisting; leaning."],
["Hanging Knee Raise","2 × 8–15","60–90 sec","Abs / hip flexors","Dynamic trunk work with pelvic control.","Hang with control. Lift knees without swinging. Finish with a small posterior pelvic tilt. Lower slowly.","Don't just lift knees; finish with pelvic control.","Kipping; swinging; dropping."]
]}
};

function keyFor(day,i,field){return "lift-"+day+"-"+i+"-"+field}
function renderDay(day){
 const d=data[day], el=document.getElementById(day);
 el.innerHTML=`<div class="dayhead"><div><h2>${d.title}</h2><p>${d.sub} · ${d.time}</p></div><button class="start" onclick="scrollToExercise('${day}',0)">Start →</button></div>
 <div class="progress"><i id="${day}-bar"></i></div>
 <details class="warmup" open><summary>🔥 WARM-UP · DO THIS BEFORE EXERCISES</summary><div class="inside">
 ${d.warm.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${keyFor(day,'warmup',i)}"><span>${x}</span></label>`).join("")}
 <p style="margin:10px 0 0;color:var(--muted);font-size:12px">Then do progressive warm-up sets for your first main exercise. These do not count as working sets.</p>
 </div></details>
 <div class="carousel" id="${day}-car">
 ${d.ex.map((e,i)=>`<article class="card">
  <div class="cardtop"><div><div class="eyenum">EXERCISE ${i+1} / ${d.ex.length}</div><h3>${e[0]}</h3><div class="focus">${e[3]}</div></div><div class="badge">${e[1]}</div></div>
  <div class="sectiontitle">Why</div><p>${e[4]}</p>
  <div class="sectiontitle">Correct form</div><p>${e[5]}</p>
  <div class="cue">🎯 ${e[6]}</div>
  <div class="avoid"><strong>Avoid:</strong> ${e[7]}</div>
  <div class="sectiontitle">Rest</div><p>${e[2]} · Default effort: <strong>2–3 RIR</strong></p>
  <div class="setlog"><div style="font-size:11px;font-weight:900;color:var(--blue);letter-spacing:.1em">LOG YOUR SETS</div>
   ${[1,2,3].map(s=>`<div class="setrow"><span>SET ${s}</span><input inputmode="decimal" placeholder="kg" data-k="${keyFor(day,i,'w'+s)}"><input inputmode="numeric" placeholder="reps" data-k="${keyFor(day,i,'r'+s)}"><input inputmode="numeric" placeholder="RIR" data-k="${keyFor(day,i,'i'+s)}"></div>`).join("")}
  </div>
 </article>`).join("")}</div>
 <div class="controls"><button class="ctrl prev">← Prev</button><span class="counter" id="${day}-counter">1 / ${d.ex.length}</span><button class="ctrl next">Next →</button></div>
 <div class="actions"><button class="action primary" onclick="startTimerFrom('${day}')">⏱ Start 90s rest</button><button class="action" onclick="clearDay('${day}')">Clear this day</button></div>
 <details class="cooldown" open><summary>🧘 COOL-DOWN · DO THIS AFTER WORKOUT</summary><div class="inside">
 <p style="margin-top:0;color:#dce2e9">Spend about 8–12 minutes here. Let your breathing settle, then use relaxed static stretches and mobility. Never force a painful range.</p>
 <ul>${d.stretch.map(x=>`<li>${x}</li>`).join("")}</ul>
 </div></details>
 <details><summary>⚡ Fuel · hydration · readiness</summary><div class="inside"><ul>
 <li>60–120 min before: protein + carbohydrates; keep very heavy/fatty meals away from training if they upset your stomach.</li>
 <li>Early session: banana + protein shake is a practical light option.</li>
 <li>Hydrate before and during. Heavy sweating/heat may justify electrolytes.</li>
 <li>Optional caffeine: roughly 1–3 mg/kg if tolerated; protect sleep.</li>
 <li><strong>Green:</strong> normal energy → train normally.</li><li><strong>Yellow:</strong> tired/poor sleep → reduce load ~5–10% or keep 3 RIR.</li><li><strong>Red:</strong> illness, dizziness, sharp pain or unusual weakness → stop/recover.</li>
 </ul></div></details>
 <details><summary>📈 Progression rule</summary><div class="inside"><p>Use double progression. Stay within the prescribed rep range. When all sets reach the top of the range with good technique and target RIR, increase the load modestly and rebuild the reps.</p><p>Log <strong>weight · reps · RIR</strong>. Don't add volume every week just because you can.</p></div></details>`;
 setupCarousel(day);bindStorage(day);
}
function setupCarousel(day){
 const car=document.getElementById(day+"-car"), cards=[...car.children], prev=document.querySelector("#"+day+" .prev"), next=document.querySelector("#"+day+" .next");
 function idx(){return Math.max(0,Math.min(cards.length-1,Math.round(car.scrollLeft/(cards[0].getBoundingClientRect().width+12))))}
 function update(){let n=idx();document.getElementById(day+"-counter").textContent=(n+1)+" / "+cards.length;document.getElementById(day+"-bar").style.width=((n+1)/cards.length*100)+"%";prev.disabled=n===0;next.disabled=n===cards.length-1}
 prev.onclick=()=>car.scrollBy({left:-(cards[0].getBoundingClientRect().width+12),behavior:"smooth"});
 next.onclick=()=>car.scrollBy({left:(cards[0].getBoundingClientRect().width+12),behavior:"smooth"});
 car.addEventListener("scroll",()=>requestAnimationFrame(update),{passive:true});update();
}
function scrollToExercise(day,n){document.getElementById(day+"-car").scrollTo({left:n*(document.getElementById(day+"-car").children[0].getBoundingClientRect().width+12),behavior:"smooth"})}
function bindStorage(day){
 document.querySelectorAll("#"+day+" input[data-k]").forEach(x=>{x.value=localStorage.getItem(x.dataset.k)||"";x.addEventListener("input",()=>localStorage.setItem(x.dataset.k,x.value))});
 document.querySelectorAll("#"+day+" input[data-check]").forEach(x=>{x.checked=localStorage.getItem(x.dataset.check)==="1";x.addEventListener("change",()=>localStorage.setItem(x.dataset.check,x.checked?"1":"0"))});
}
function clearDay(day){
 if(!confirm("Clear all saved logs and warm-up checks for "+data[day].title+"?"))return;
 Object.keys(localStorage).filter(k=>k.startsWith("lift-"+day+"-")).forEach(k=>localStorage.removeItem(k));
 document.getElementById(day).querySelectorAll("input").forEach(x=>{if(x.type==="checkbox")x.checked=false;else x.value=""});
}
Object.keys(data).forEach(renderDay);

document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>show(b.dataset.day));
document.querySelectorAll("[data-bottom]").forEach(b=>b.onclick=()=>{
 if(b.dataset.bottom==="reset"){if(confirm("Clear ALL workout logs and checks?")){Object.keys(localStorage).filter(k=>k.startsWith("lift-")).forEach(k=>localStorage.removeItem(k));location.reload()}return}
 show(b.dataset.bottom);
});
function show(day){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(day).classList.add("active");
 document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.day===day));
 document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.bottom===day));
 window.scrollTo({top:0,behavior:"smooth"});
}

const timer=document.getElementById("timer"),timerText=document.getElementById("timerText");
let seconds=90,interval=null;
function drawTimer(){timerText.textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")}
function startTimerFrom(day){seconds=90;drawTimer();timer.classList.add("show");startTimer()}
function startTimer(){clearInterval(interval);document.getElementById("timerStart").textContent="Pause";interval=setInterval(()=>{if(seconds>0){seconds--;drawTimer()}else{clearInterval(interval);navigator.vibrate?.([200,100,200]);document.getElementById("timerStart").textContent="Start"}},1000)}
document.getElementById("timerStart").onclick=()=>{if(interval){clearInterval(interval);interval=null;document.getElementById("timerStart").textContent="Start"}else startTimer()}
document.getElementById("timerMinus").onclick=()=>{seconds=Math.max(0,seconds-15);drawTimer()}
document.getElementById("timerPlus").onclick=()=>{seconds+=15;drawTimer()}
document.getElementById("timerClose").onclick=()=>{clearInterval(interval);interval=null;timer.classList.remove("show");document.getElementById("timerStart").textContent="Start"}
drawTimer();
